<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08040a">
<title>¡BOOM! 3D · remake de fans</title>
<link rel="icon" href="assets/img/icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div id="app"></div>
<div id="loading"><div class="ld">💣</div><div>Cargando plató…</div></div>

<div id="menu" class="transparent hidden"></div>

<div id="hud" class="hidden">
  <div id="hPhase"></div>
  <div id="timer" class="hidden">0</div>
  <div id="score"><div class="sc red"><i></i><span class="n">ROJO</span><b>0 €</b></div><div class="sc blue"><i></i><span class="n">AZUL</span><b>0 €</b></div></div>
</div>
<div id="play" class="hidden"></div>
<div id="sub" class="hidden"></div>
<div id="chat"></div>
<div id="overlay" class="hidden"></div>
<div id="topBtns" class="hidden">
  <button id="tbHome" title="Menú">⌂</button><button id="tbCam" title="Cámara">🎥</button><button id="tbWalk" title="Pasear">🚶</button><button id="tbLights" title="Luces">💡</button><button id="tbMute" title="Sonido">🔊</button>
</div>
<div id="skip" class="hidden">⏭</div>
<div id="glights" class="hidden"></div>
<div id="joy" class="hidden"><div id="knob"></div></div>
<div id="flash"></div><div id="wflash"></div><div id="lt" class="hidden"><img id="ltLogo" alt=""><div class="bar"><b></b><i></i></div></div>
<div id="mosca" class="hidden"><img id="moscaLogo" alt=""><span>DIRECTO</span></div>
<div id="wm">¡BOOM! 3D · remake de fans · no oficial</div>
<div id="qinfo"></div>
<script src="game.js"></script>
</body>
</html>
